name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:


  sast_scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit (SAST Scan)
        run: |
          echo "=== Running Bandit SAST Scanner ==="
          bandit -r . -f sarif -o bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'bandit-results.sarif'
          category: 'bandit-sast'

  sast_codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python','javascript-typescript' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secret_scan:
    name: Secrets (Trufflehog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --debug

 
  sca_scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build --no-cache -t devsecops-demo-app:latest .

      - name: Check installed Python packages
        run: |
          docker run --rm devsecops-demo-app:latest python -c "import msgpack, setuptools; print('msgpack:', msgpack.__version__); print('setuptools:', setuptools.__version__)"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
        env:
          TRIVY_NO_CACHE: 'true'

      - name: Debug - Trivy Human Readable Output
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

  dast_scan:
    name: DAST (OWASP ZAP - Multi-Target)
    runs-on: ubuntu-latest
    needs: sca_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & Run Flask App
        run: |
          docker build --no-cache -t devsecops-demo-app:latest .
          docker run -d --name test-flask-app -p 5000:5000 devsecops-demo-app:latest
          sleep 5

      - name: Install & Run Node.js App
        run: |
          npm install express
          node app.js &
          sleep 5
          # Check if both apps are running
          curl -I "http://localhost:5000/greet?name=test"
          curl -I "http://localhost:3000/os-cmd/ping?host=127.0.0.1"

      - name: Prepare ZAP Output Dir
        run: |
          mkdir -p zap_out
          chmod 777 zap_out
          chmod 666 zap_rules.tsv || true

      # ZAP Even if Vulnerability Found: Flask App (Node.js scan will run regardless of Flask scan result)
      - name: OWASP ZAP Scan - Flask App
        run: |
          docker run --net=host \
            -v $(pwd)/zap_rules.tsv:/zap/wrk/zap_rules.tsv:ro \
            -v $(pwd)/zap_out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t "http://localhost:5000/greet?name=test" \
            -c zap_rules.tsv \
            -r zap_report_flask.html \
            -J zap_report_flask.json \
            -I ||  echo "FLASK_FAILED=true" >> $GITHUB_ENV

      # ZAP Even if Vulnerability Found: Node.js App (Flask'ta zafiyet olsa bile çalışır)
      - name: OWASP ZAP Scan - Node.js App
        run: |
          docker run --net=host \
            -v $(pwd)/zap_rules.tsv:/zap/wrk/zap_rules.tsv:ro \
            -v $(pwd)/zap_out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t "http://localhost:3000/os-cmd/ping?host=127.0.0.1" \
            -c zap_rules.tsv \
            -r zap_report_node.html \
            -J zap_report_node.json \
            -I || echo "NODE_FAILED=true" >> $GITHUB_ENV

      # Upload ZAP Reports as Artifacts
      - name: Upload All ZAP Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-multi-app-reports
          path: zap_out/

      # Last check for vulnerabilities and fail the job if any are found
      - name: Evaluate DAST Security Gate
        run: |
          if [ "$FLASK_FAILED" = "true" ] || [ "$NODE_FAILED" = "true" ]; then
            echo "::error:: Security vulnerabilities detected in DAST scan. Failing the job."
            exit 1
          fi
      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app   || true
name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_scans:
    name: Security Scanning Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      #  SAST (Bandit)
      - name: Run Bandit (SAST Scan)
        run: |
          echo "=== Running Bandit SAST Scanner ==="
          bandit -r .

      # #Secret Scanning (Trufflehog)
      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --debug --only-verified

      #  Compile Docker Image
      - name: Build Docker Image
        run: |
          docker build -t devsecops-demo-app:latest .

      #  Container Security (Trivy)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      #  Deploy the application in a container for DAST
      - name: Run Container for DAST
        run: |
          docker run -d --name test-app -p 5000:5000 devsecops-demo-app:latest
          sleep 5
      #  DAST (OWASP ZAP Baseline Scan)
      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --net=host -v $GITHUB_WORKSPACE:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:5000/ \
            -r zap_report.html \
            -J zap_report.json || true
          
          # Dosyaların oluşup oluşmadığını terminale yazdır
          ls -la zap_report.*

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always() # ensure the report is uploaded even if the scan fails
        with:
          name: zap-scan-report
          path: |
            zap_report.html
            zap_report.json
      #  Stop and Remove the Container
      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop test-app
          docker rm test-app
name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:


  sast_scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit (SAST Scan)
        run: |
          echo "=== Running Bandit SAST Scanner ==="
          bandit -r . -f sarif -o bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'bandit-results.sarif'
          category: 'bandit-sast'
  sast_codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret_scan:
    name: Secrets (Trufflehog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --debug

 
  sca_scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --no-cache -t devsecops-demo-app:latest .

      - name: Check installed Python packages
        run: |
          docker run --rm devsecops-demo-app:latest python -c "import msgpack, setuptools; print('msgpack:', msgpack.__version__); print('setuptools:', setuptools.__version__)"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
        env:
          TRIVY_NO_CACHE: 'true'

      - name: Debug - Trivy Human Readable Output
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

 
  dast_scan:
    name: DAST (ZAP)
    runs-on: ubuntu-latest
    needs: sca_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --no-cache -t devsecops-demo-app:latest .

      - name: Run Container for DAST
        run: |
          docker run -d --name test-app -p 5000:5000 devsecops-demo-app:latest
          sleep 5

      - name: OWASP ZAP Scan
        run: |
          mkdir -p zap_out
          chmod 777 zap_out
          chmod 666 zap_rules.tsv || true

          docker run --net=host \
            -v $(pwd)/zap_rules.tsv:/zap/wrk/zap_rules.tsv:ro \
            -v $(pwd)/zap_out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t "http://localhost:5000/greet?name=test" \
            -c zap_rules.tsv \
            -r zap_report.html \
            -J zap_report.json

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            zap_out/zap_report.html
            zap_out/zap_report.json

      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app   || true